<div class="app-frame">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Tests de oposiciones, inicio">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span>tests <strong>justicia</strong></span>
    </a>

    <nav class="topnav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Nuevo test</a>
    </nav>

    @if (auth.currentUser$ | async; as user) {
      <button class="account-button" type="button" (click)="logout()" [title]="'Cerrar sesión de ' + (user.email ?? 'usuario')">
        <span class="account-dot"></span>
        <span class="account-label">{{ user.email }}</span>
        <span class="logout-label">Salir</span>
      </button>
    } @else {
      <a class="login-link" routerLink="/login">
        <span>Acceso</span>
        <span aria-hidden="true">↗</span>
      </a>
    }
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="site-footer">
    <span>Preguntas oficiales y generadas por Claude.</span>
    <span>2026</span>
  </footer>
</div>
